  function estimateConcreteStrength(el) {
    var s = info(el);
    var grade = String(el.mixGrade || MIX_GRADES[0]);
    var designPsi = 3500, designMpa = 24;
    if (grade.indexOf('4,000') >= 0) { designPsi = 4000; designMpa = 28; }
    else if (grade.indexOf('4,500') >= 0) { designPsi = 4500; designMpa = 31; }
    else if (grade.indexOf('3,000') >= 0) { designPsi = 3000; designMpa = 21; }

    var missedCount = s.missed.length;
    var retention28 = Math.max(64, 100 - missedCount * 7 - (s.status === 'due' && s.day > 1 ? 3 : 0));
    var dayProgress = Math.min(7, s.logged) / 7;
    var currentPctOfDesign = Math.round((28 + dayProgress * 48) * (retention28 / 100));
    var currentPsi = Math.round((designPsi * currentPctOfDesign) / 100 / 10) * 10;
    var projected28Psi = Math.round((designPsi * retention28) / 100 / 10) * 10;
    var stripReady = s.complete && missedCount === 0;
    var statusText = stripReady
      ? 'Approved for Formwork Stripping & Progress Billing'
      : (s.complete && el.engineerNote
          ? 'Conditional Release (Corrective Curing Logged)'
          : (missedCount > 0
              ? 'Hold Form Stripping — Extend Curing +' + missedCount + ' ' + plural(missedCount, 'Day', 'Days')
              : 'In Active Hydration (Target 70% f\'c at Day 7)'));
    return {
      designPsi: designPsi,
      designMpa: designMpa,
      currentPct: currentPctOfDesign,
      currentPsi: currentPsi,
      retention28: retention28,
      projected28Psi: projected28Psi,
      stripReady: stripReady,
      missedCount: missedCount,
      statusText: statusText
    };
  }

  /* =========================================================
     Sheets, toast, big QR, printing
     ========================================================= */
  var sheetTriggerEl = null;

  function openSheet(html) {
    var layer = $('#sheet');
    var wasOpen = layer.classList.contains('open');
    if (!wasOpen && document.activeElement && document.activeElement !== document.body) {
      sheetTriggerEl = document.activeElement;
    }
    layer.innerHTML =
      '<div class="scrim" data-action="close-sheet"></div>' +
      '<div class="sheet" id="activeSheetDialog" role="dialog" aria-modal="true">' +
        '<div class="sheet-grab-area" id="sheetGrabArea" aria-hidden="true"><span class="sheet-grab"></span></div>' +
        html +
      '</div>';
    layer.classList.add('open');
    bindSheetSwipe();
    if (!wasOpen) {
      var closeBtn = layer.querySelector('[data-action="close-sheet"].icon-btn') || layer.querySelector('.sheet button');
      if (closeBtn) { try { closeBtn.focus(); } catch (e) {} }
    }
  }

  function closeSheet() {
    var layer = $('#sheet');
    if (!layer.classList.contains('open')) return;
    layer.classList.remove('open');
    layer.innerHTML = '';
    if (sheetTriggerEl && document.body.contains(sheetTriggerEl)) {
      try { sheetTriggerEl.focus(); } catch (e) {}
    }
    sheetTriggerEl = null;
  }

  function bindSheetSwipe() {
    var sh = $('#activeSheetDialog');
    if (!sh) return;
    var startY = 0, currentY = 0, tracking = false;
    sh.addEventListener('touchstart', function (e) {
      if (!e.touches || e.touches.length !== 1) return;
      var onGrab = e.target && e.target.closest && e.target.closest('#sheetGrabArea, .sheet-head');
      if (sh.scrollTop > 2 && !onGrab) return;
      startY = e.touches[0].clientY;
      currentY = startY;
      tracking = true;
    }, { passive: true });

    sh.addEventListener('touchmove', function (e) {
      if (!tracking || !e.touches || !e.touches.length) return;
      currentY = e.touches[0].clientY;
      var dy = currentY - startY;
      if (dy > 4) {
        sh.classList.add('dragging');
        sh.style.transform = 'translateY(' + Math.min(340, dy) + 'px)';
      }
    }, { passive: true });

    function endSwipe() {
      if (!tracking) return;
      tracking = false;
      var dy = currentY - startY;
      sh.classList.remove('dragging');
      if (dy > 76) {
        closeSheet();
      } else {
        sh.classList.add('snapping');
        sh.style.transform = '';
        setTimeout(function () { if (sh) sh.classList.remove('snapping'); }, 240);
      }
    }
    sh.addEventListener('touchend', endSwipe, { passive: true });
    sh.addEventListener('touchcancel', endSwipe, { passive: true });
  }

  function fetchLiveWeather(lat, lng, showFeedback) {
    var qLat = lat != null ? lat : (gps.lat != null ? gps.lat : SITE.lat);
    var qLng = lng != null ? lng : (gps.lng != null ? gps.lng : SITE.lng);
    if (!window.fetch) {
      if (showFeedback) toast('Weather API unavailable in this browser');
      return;
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + Number(qLat).toFixed(4) +
              '&longitude=' + Number(qLng).toFixed(4) +
              '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto';
    fetch(url)
      .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
      .then(function (data) {
        if (!data || !data.current || typeof data.current.temperature_2m !== 'number') return;
        if (!weather.manualOverride || showFeedback) {
          weather.manualOverride = false;
          weather.temp = Math.round(data.current.temperature_2m);
          weather.humidity = Math.round(data.current.relative_humidity_2m || 68);
          weather.windKmh = Math.round(data.current.wind_speed_10m || 10);
          var code = data.current.weather_code || 0;
          if ((code >= 51 && code <= 67) || (code >= 80 && code <= 99)) {
            weather.condition = 'Rainy';
          } else if (code <= 1 || weather.temp >= 33) {
            weather.condition = 'Sunny';
          } else {
            weather.condition = 'Partly Cloudy';
          }
          weather.source = 'live';
          weather.updatedAt = new Date().toISOString();
          TEMP_C = weather.temp;
          updateChips();
          if (current().r === 'home') render(false);
          if ($('#sheet').classList.contains('open') && $('#envSheetMarker')) sheetEnv();
          if (showFeedback) toast('Live weather: ' + TEMP_C + DEG + 'C ' + weather.condition + ' (' + weather.humidity + '% RH)');
        }
      })
      .catch(function () {
        if (showFeedback) toast('Offline — using site weather (' + TEMP_C + DEG + 'C, ' + weather.humidity + '% RH)');
      });
  }

  function requestGPS(forceCalibrate) {
    if (!navigator.geolocation) {
      gps.status = 'site';
      updateChips();
      return;
    }
    gps.status = 'locating';
    updateChips();
    try {
      navigator.geolocation.getCurrentPosition(function (pos) {
        gps.lat = pos.coords.latitude;
        gps.lng = pos.coords.longitude;
        gps.accuracy = Math.round(pos.coords.accuracy || 12);
        gps.status = 'real';
        /* Auto-calibrate site anchor to the presenter's venue on first GPS lock if uncalibrated */
        var rawDist = calcDistanceMeters(gps.lat, gps.lng, SITE.lat, SITE.lng);
        if (forceCalibrate || (!SITE.calibrated && rawDist > 800)) {
          SITE.lat = +(gps.lat - 0.00009).toFixed(6);
          SITE.lng = +(gps.lng - 0.00006).toFixed(6);
          SITE.calibrated = true;
          gps.simMode = 'auto';
          saveState();
          if (forceCalibrate) toast('Site geofence anchored to your live GPS (' + coord(SITE.lat) + ', ' + coord(SITE.lng) + ')');
        }
        var wxAge = weather.updatedAt ? (Date.now() - new Date(weather.updatedAt).getTime()) : 999999;
        if (forceCalibrate || wxAge > 300000) {
          fetchLiveWeather(gps.lat, gps.lng, false);
        }
        updateChips();
        if (current().r === 'home') render(false);
        if (forceCalibrate && $('#sheet').classList.contains('open') && $('#envSheetMarker')) sheetEnv();
      }, function () {
        gps.status = 'site';
        updateChips();
        if (forceCalibrate) toast('GPS permission denied — using simulated site coordinates');
      }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 });
    } catch (e) {
      gps.status = 'site';
      updateChips();
    }
  }

  function stopCamera(keepState) {
    scan.token++;
    scan.running = false;
    scan.busy = false;
    scan.torchOn = false;
    scan.hwTorch = false;
    clearTimeout(scan.timer);
    scan.timer = null;
    if (scan.stream) {
      scan.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* ignore */ } });
      scan.stream = null;
    }
    var v = $('#cam');
    if (v) { try { v.pause(); } catch (e) { /* ignore */ } v.srcObject = null; }
    var vf = $('#vf');
    if (vf) vf.classList.remove('torch-boost');
    if (!keepState && scan.camState !== 'error') scan.camState = 'idle';
  }

  function startCamera() {
    stopCamera(true);
    var token = ++scan.token;
    scan.camState = 'starting';
    scan.camError = '';
    renderVfMsg();
    updateScanUI();
    var md = navigator.mediaDevices;
    if (!window.isSecureContext || !md || !md.getUserMedia) { camFail('insecure'); return; }
    var preferredFacing = scan.facingMode || 'environment';
    md.getUserMedia({ audio: false, video: { facingMode: { ideal: preferredFacing }, width: { ideal: 1280 }, height: { ideal: 960 } } })
      .catch(function (err) {
        if (err && (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError')) {
          return md.getUserMedia({ audio: false, video: true });
        }
        throw err;
      })
      .then(function (stream) {
        if (token !== scan.token || current().r !== 'scan') {
          stream.getTracks().forEach(function (t) { t.stop(); });
          return;
        }
        var v = $('#cam');
        if (!v) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        scan.stream = stream;
        var track = stream.getVideoTracks()[0];
        var settings = (track && track.getSettings) ? track.getSettings() : {};
        v.classList.toggle('mirror', settings.facingMode === 'user' || preferredFacing === 'user');
        v.srcObject = stream;
        scan.camState = 'on';
        scan.running = true;
        var played = v.play();
        if (played && played.catch) {
          played.catch(function () {
            if (token === scan.token) { scan.camState = 'paused'; renderVfMsg(); }
          });
        }
        renderVfMsg();
        updateScanUI();
        tick();
      })
      .catch(function (err) { if (token === scan.token) camFail(err && err.name); });
  }

  function camFail(name) {
    scan.camState = 'error';
    scan.running = false;
    var inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    var msg;
    if (name === 'insecure') msg = 'The camera only works on an https link, or on a file opened from this computer.';
    else if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      msg = inFrame ? 'This preview window blocks the camera. Open the app as its own page, then try again.'
                    : 'Camera access is blocked. Allow the camera for this page in your browser, then try again.';
    }
    else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') msg = 'No camera was found on this device.';
    else if (name === 'NotReadableError' || name === 'TrackStartError') msg = 'Another app is using the camera. Close it, then try again.';
    else msg = 'The camera did not start.';
    scan.camError = msg;
    renderVfMsg();
    updateScanUI();
  }

  function tick() {
    if (!scan.running) return;
    var v = $('#cam');
    if (!v || scan.targetId || scan.busy || v.readyState < 2 || !v.videoWidth) { scan.timer = setTimeout(tick, 160); return; }
    var dec = getDecoder();
    if (!dec && !nativeDetector) { scan.timer = setTimeout(tick, 400); return; }
    var w = v.videoWidth, h = v.videoHeight, k = Math.min(1, 720 / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
    if (!scan.canvas) scan.canvas = document.createElement('canvas');
    if (scan.canvas.width !== cw || scan.canvas.height !== ch) { scan.canvas.width = cw; scan.canvas.height = ch; scan.ctx = null; }
    if (!scan.ctx) scan.ctx = scan.canvas.getContext('2d', { willReadFrequently: true });
    scan.ctx.drawImage(v, 0, 0, cw, ch);
    if (dec) {
      var res = null;
      try {
        var img = scan.ctx.getImageData(0, 0, cw, ch);
        res = dec(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
      } catch (e) { res = null; }
      if (res && res.data) onQR(res.data);
      scan.timer = setTimeout(tick, 130);
    } else {
      scan.busy = true;
      nativeDetector.detect(scan.canvas).then(function (codes) {
        scan.busy = false;
        if (codes && codes.length && codes[0].rawValue) onQR(codes[0].rawValue);
      }).catch(function () { scan.busy = false; });
      scan.timer = setTimeout(tick, 220);
    }
  }

  function onQR(text) {
    if (scan.targetId) return;
    var p = parsePayload(text);
    if (!p) {
      var now = Date.now();
      if (now - scan.lastBad > 2500) { scan.lastBad = now; toast('That code is not a CureProof label'); }
      return;
    }
    var el = byId(p.id);
    if (!el && p.name) {
      el = { id: p.id, name: p.name, type: p.type, location: p.location || 'Site', pourDate: p.pourDate, method: p.method, worker: p.worker, logs: {} };
      state.els.push(el);
      saveState();
      toast('Added ' + el.name + ' from its label');
    }
    if (!el) { toast('This label is not in the demo data'); return; }
    identify(el.id);
  }

  function identify(id) {
    var el = byId(id);
    if (!el) return;
    scan.targetId = id;
    scan.lockCompact = false;
    clearTimeout(scan.lockBannerTimer);
    playScanBeep();
    if (navigator.vibrate) { try { navigator.vibrate([50, 40, 70]); } catch (e) { /* ignore */ } }
    var vf = $('#vf');
    if (vf) vf.classList.add('found');
    renderVfMsg();
    updateScanUI();
    scan.lockBannerTimer = setTimeout(function () {
      if (scan.targetId === id) {
        scan.lockCompact = true;
        renderLockBanner();
      }
    }, 2800);
  }

  function renderVfMsg() {
    var m = $('#vfMsg');

      cls += ' show'; html = '<p>Starting the camera' + ELLIPSIS + '</p>';

      cls += ' show'; html = '<p>Tap to start the camera.</p><div class="vf-actions"><button class="btn btn-amber btn-sm" data-action="cam-play">Start camera</button></div>';
    } else if (scan.camState === 'error') {

        '<button class="btn btn-ghost btn-sm" data-action="pick">Pick element</button></div><p class="tiny">You can still log it with a sample photo.</p>';
    } else if (scan.camState === 'on' && !scan.targetId && !scannerReady()) {
      cls += ' show soft';
      html = libs.scan === 'failed'
        ? '<p>The QR reader did not load. Check the internet, or use the pick link above.</p>'
        : '<p>Loading the QR reader' + ELLIPSIS + '</p>';
    }
    if (m.className !== cls) m.className = cls;
    if (m.innerHTML !== html) m.innerHTML = html;
    var line = $('#scanline');

  function capture(forceOutZone) {
    var el = scan.targetId ? byId(scan.targetId) : null;
    if (!el) { toast('Scan the element\'s QR label first'); return; }
    var s = info(el);
    if (s.complete) { toast('This element already finished curing'); return; }
    var gf = geofenceState();
    if (!gf.inZone && SITE.strictGeofence && !forceOutZone) {
      sheetGeofenceAlert(el, gf);
      return;
    }

    var v = $('#cam');
    var hasApkPhoto = !!scan.customCaptureCanvas;
    var live = hasApkPhoto || (scan.camState === 'on' && v && v.videoWidth > 0);
    var c;
    if (hasApkPhoto) {
      c = scan.customCaptureCanvas;
      scan.customCaptureCanvas = null;
    } else if (live) {
      var k = Math.min(1, 960 / Math.max(v.videoWidth, v.videoHeight));
      c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * k);
      c.height = Math.round(v.videoHeight * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    } else {
      c = concreteCanvas(el, hash(el.id + Date.now()), 720, 540);
    }
    var loggedBy = (state.user && state.user.name) ? state.user.name : (el.worker || 'Site crew');
    var sig = getSignalState();
    var syncState = sig.canUpload ? 'synced' : 'queued';
    var log = {
      time: new Date().toISOString(),
      lat: gf.lat,
      lng: gf.lng,
      gpsReal: gf.isReal,
      distM: gf.distM,
      inZone: gf.inZone,
      temp: TEMP_C,
      condition: weather.condition || 'Sunny',
      humidity: weather.humidity || 68,
      photo: null,
      hasCustomPhoto: true,
      syncStatus: syncState,
      by: loggedBy
    };
    stamp(c, el, s.day, log);
    var dataUrl = c.toDataURL('image/jpeg', 0.82);
    log.photo = dataUrl;
    el.logs[s.day] = log;
    var photoKey = el.id + ':' + s.day;
    if (!photoCache[photoKey]) customPhotoCount++;
    photoCache[photoKey] = dataUrl;
    idbSavePhoto(photoKey, dataUrl);
    if (syncState === 'queued') {
      enqueueOfflineLog(el, s.day, log);
      toast('Low signal: Saved to device. Will auto-upload when signal is strong.');
    }
    saveState();

    var flash = $('#flash');
    if (flash) flash.classList.add('on');
    stopCamera();
    var day = s.day;
    setTimeout(function () { replaceRoute({ r: 'done', id: el.id, day: day, sample: !live }); }, reduceMotion() ? 0 : 220);
  }

  /* =========================================================
     Navigation
     ========================================================= */
  var ROOTS = { home: true, pours: true, analytics: true };
  var historyOK = true;
  var historyPushedCount = 0;

  function cloneStack(stk) {
    try { return JSON.parse(JSON.stringify(stk || state.stack)); }
    catch (e) { return [{ r: 'home' }]; }
  }
  function syncHistoryPush() {
    if (!historyOK) return;
    try {
      history.pushState({ cpStack: cloneStack(state.stack) }, '');
      historyPushedCount++;
    } catch (e) { historyOK = false; }
  }
  function syncHistoryReplace() {
    if (!historyOK) return;
    try {
      history.replaceState({ cpStack: cloneStack(state.stack) }, '');
    } catch (e) { historyOK = false; }
  }

  function current() { return state.stack[state.stack.length - 1]; }
  function leave(route) {
    closeSheet();
    hideBigQR();
    clearTimeout(toastTimer);
    $('#toast').classList.remove('show');
    if (route && route.r === 'scan') {
      stopCamera();
      clearInterval(scan.clock);
      clearTimeout(scan.lockBannerTimer);
      scan.clock = null;
      scan.targetId = null;
      scan.customCaptureCanvas = null;
      if (scan.camState === 'error') scan.camState = 'idle';
      syncWakeLock();
    }
  }
  function go(route) {
    leave(current());
    state.stack.push(route);
    syncHistoryPush();
    render(true);
  }
  function replaceRoute(route) {
    leave(current());
    state.stack[state.stack.length - 1] = route;
    syncHistoryReplace();
    render(true);
  }
  function setRoot(route) {
    leave(current());
    state.stack = [route];
    syncHistoryPush();
    render(true);
  }
  function popRoute() {
    if (state.stack.length <= 1) return;
    leave(current());
    state.stack.pop();
    syncHistoryReplace();
    render(true);
  }
  function back() {
    if (state.stack.length <= 1) return;
    if (historyOK && historyPushedCount > 0) {
      try { historyPushedCount--; history.back(); return; } catch (e) { historyOK = false; }
    }
    popRoute();
  }

  function render(resetScroll) {
    if (!state.user && current().r !== 'auth' && current().r !== 'welcome') {
      state.stack = [{ r: 'welcome' }];
    }
    var r = current(), html;
    switch (r.r) {
      case 'welcome': html = vWelcome(); break;
      case 'auth': html = vAuth(); break;
      case 'pours': html = isLaborer() ? vLaborerHome() : vPours(); break;
      case 'analytics': html = isLaborer() ? vLaborerHome() : vAnalytics(); break;
      case 'daylogs': html = vDayLogs(r); break;
      case 'record': html = vRecord(r); break;
      case 'qr': html = vQR(r); break;
      case 'new': html = vNew(); break;
      case 'scan': html = vScan(); break;
      case 'done': html = vDone(r); break;
      case 'cert': html = vCert(r); break;
      default: html = vHome();
    }
    var app = $('#app');
    var isWelcome = r.r === 'welcome';
    /* Show the bottom navigation tabbar only for Site Engineer root screens */
    var showTabs = !!state.user && !isLaborer() && !!ROOTS[r.r];
    app.innerHTML = '<div class="screen screen-' + r.r + '">' + html + '</div>';
    app.classList.toggle('no-tabs', !showTabs);
    app.classList.toggle('is-welcome', isWelcome);
    $('#device').classList.toggle('no-tabs', !showTabs);
    var hasConcreteBanner = isWelcome || r.r === 'auth' || r.r === 'home';
    $('#statusbar').classList.toggle('light', hasConcreteBanner);
    $('#tabbar').hidden = !showTabs;
    updateTabs();
    if (resetScroll) app.scrollTop = 0;
    syncScrollEffect();
    if (r.r === 'scan') enterScan(r.presetId);
    if (r.r === 'home' && !isLaborer()) animatePct();
  }

  function tabbarHTML() {
    return [['home', 'Home', 'home'], ['scan', 'Scan', 'scan'], ['pours', 'Pours', 'list'], ['analytics', 'Stats', 'chart']].map(function (t) {
      return '<button class="tab" data-action="tab" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + icon(t[2], 22) + '<span>' + t[1] + '</span></button>';
    }).join('') + '<button class="tab" data-action="profile" aria-label="Profile">' + icon('user', 22) + '<span>Profile</span></button>';
  }
  function updateTabs() {
    var r = current().r;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      var on = b.getAttribute('data-tab') === r;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  function animatePct() {
    var n = $('#pct'), bar = $('#pctBar');
    if (!n) return;
    var to = +n.getAttribute('data-to');
    var from = state.lastPct == null ? to : state.lastPct;
    state.lastPct = to;
    if (from === to || reduceMotion()) { n.textContent = to; return; }
    n.textContent = from;
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = from + '%';
      void bar.offsetWidth;
      bar.style.transition = '';
      bar.style.width = to + '%';
    }
    var t0 = null;
    function step(ts) {
      if (!document.body.contains(n)) return;
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / 800), e = 1 - Math.pow(1 - k, 3);
      n.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function submitAuthForm() {
    var f = $('#authForm');
    if (!f) return;
    var nameInput = f.querySelector('[name=userName]');
    var posInput = f.querySelector('[name=userPos]');
    var projInput = f.querySelector('[name=userProject]');
    var err = $('#authError');
    var name = clean(nameInput ? nameInput.value : '');
    var pos = clean(posInput ? posInput.value : '');
    var proj = clean(projInput ? projInput.value : '');
    if (!name) {
      if (err) err.textContent = 'Enter your name to continue.';
      if (nameInput) nameInput.focus();
      return;
    }
    var role = state.authRoleDraft || 'engineer';
    if (!pos) pos = role === 'engineer' ? 'Site Engineer' : 'Laborer';
    if (!proj) proj = DEFAULT_SITE_NAME;
    saveUser({ name: name, role: role, position: pos, project: proj });
    state.lastPct = null;
    setRoot({ r: 'home' });
    toast('Signed in as ' + name + ' (' + (role === 'engineer' ? 'Site Engineer' : 'Laborer') + ')');
  }

  function createPour() {
    var f = $('#newForm');
    if (!f) return;
    var nameInput = f.querySelector('[name=name]');
    var name = clean(nameInput.value);
    var err = $('#formError');
    if (!name) { err.textContent = 'Give the element a name, like Slab B3-1.'; nameInput.focus(); return; }
    var typeInput = f.querySelector('[name=type]:checked');
    var date = f.querySelector('[name=date]').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > today()) date = today();
    var el = {
      id: 'p' + Date.now().toString(36),
      name: name,
      type: typeInput ? typeInput.value : 'Slab',
      location: clean(f.querySelector('[name=location]').value) || 'Site',
      pourDate: date,
      method: f.querySelector('[name=method]').value,
      worker: clean(f.querySelector('[name=worker]').value) || 'Site crew',
      mixGrade: f.querySelector('[name=mixGrade]') ? f.querySelector('[name=mixGrade]').value : MIX_GRADES[0],
      engineerNote: '',
      logs: {}
    };
    state.els.push(el);
    saveState();
    replaceRoute({ r: 'qr', id: el.id });
    toast(el.name + ' added and saved.');
  }

          e.preventDefault();
          lastEl.focus();

          e.preventDefault();
          firstEl.focus();

      }

      if (e.target.closest && e.target.closest('#newForm')) {
        e.preventDefault();

    } catch (e) {}

    /* Handle PWA File Handlers (launchQueue for .json backups) */
    if ('launchQueue' in window && window.launchQueue && typeof window.launchQueue.setConsumer === 'function') {
      window.launchQueue.setConsumer(function (launchParams) {
        if (!launchParams || !launchParams.files || !launchParams.files.length) return;
        launchParams.files[0].getFile().then(function (file) {
          if (file && file.name && file.name.toLowerCase().endsWith('.json')) {
            if (!state.user) saveUser(DEMO_PROFILES[0]);
            importJSONFile(file);
          }
        }).catch(function () {});
      });
    }
  }
  init();
})();
</script>
</body>
</html>
